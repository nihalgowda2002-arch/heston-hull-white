[project]
name = "svpricing"
version = "1.0.0"
description = "Hull-White and Heston stochastic volatility models: pricing, simulation and calibration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nihal Naresh Kumar" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools]
packages = ["svpricing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
